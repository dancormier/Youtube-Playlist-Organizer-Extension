<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h1>Playlist Organizer</h1>
  </div>
  <div class="perm-banner" id="perm-banner" hidden>
    <p class="perm-text" id="perm-text">
      This add-on needs access to YouTube before the Organize button can appear
      on playlist pages.
    </p>
    <button id="grant-btn">Grant access to YouTube</button>
  </div>
  <div class="settings-form">
    <label for="api-key-input">Claude API Key</label>
    <input type="password" id="api-key-input" placeholder="sk-ant-...">
    <button id="save-key-btn">Save</button>
    <p id="key-status" class="status-text"></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
